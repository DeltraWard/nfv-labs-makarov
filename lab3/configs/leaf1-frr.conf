router bgp ${AS1}
 bgp router-id 10.${N}.255.1
 no bgp ebgp-requires-policy
 neighbor 10.${N}.0.1 remote-as ${AS2}
 address-family ipv4 unicast
  neighbor 10.${N}.0.1 activate
  network 10.${N}.255.1/32
 exit-address-family
 address-family l2vpn evpn
  neighbor 10.${N}.0.1 activate
  advertise-all-vni
 exit-address-family
exit

router bgp ${AS2}
 bgp router-id 10.${N}.255.2
 no bgp ebgp-requires-policy
 neighbor 10.${N}.0.0 remote-as ${AS1}
 address-family ipv4 unicast
  neighbor 10.${N}.0.0 activate
  network 10.${N}.255.2/32
 exit-address-family
 address-family l2vpn evpn
  neighbor 10.${N}.0.0 activate
  advertise-all-vni
 exit-address-family
exit
